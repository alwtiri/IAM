      - SHARED
      - EMERGENCY
      - UNKNOWN
    AccountGovernanceState:
      type: string
      enum:
      - DISCOVERED
      - GOVERNED
      - MANAGED
      - EXCLUDED
      - REMOVED
    AccountNativeStatus:
      type: string
      enum:
