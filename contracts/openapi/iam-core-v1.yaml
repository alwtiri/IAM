          type:
          - string
          - 'null'
        limit:
          type: integer
    AccountGovernanceChange:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        ownerIdentityId: *id017
        linkedIdentityId: *id017
