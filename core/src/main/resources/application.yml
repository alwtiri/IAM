# iam-core configuration. All environment-specific values come from environment variables or mounted secret files.
# No secret has a default value here.
spring:
  application:
    name: iam-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://postgres:5432/iam}
    username: ${IAM_DB_USER:iam_app}
    password: ${IAM_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${IAM_DB_POOL_MAX:20}
      connection-timeout: 5000
  flyway:
    enabled: ${IAM_FLYWAY_ENABLED:true}
    # Migrations run as the owner role; the application role has DML only (DATA-MODEL.md §1.10).
    user: ${IAM_DB_MIGRATION_USER:iam_owner}
    password: ${IAM_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
