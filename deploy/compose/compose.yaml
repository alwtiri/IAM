# =====================================================================
# Enterprise IAM / PAM — development & test stack (Phase 1 foundation)
# ADR-0009 (Docker-first) · docs/architecture/DEPLOYMENT.md
#
#   ./scripts/generate-dev-secrets.sh      # once: creates ./secrets/* (git-ignored)
#   docker compose up -d --build
#   ./scripts/vault-init-dev.sh            # once per fresh vault volume (dev only)
#
# Later-phase services (worker pools, scheduler, gateways, integrations, object store) are added in
# separate compose files in their phases. They are intentionally NOT declared here (gate clarification G10).
# Image tags are pinned to exact versions; digest pinning is automated in Phase 9.
# =====================================================================
name: iam

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 512
  tmpfs:
    - /tmp:size=64m,mode=1777

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:

  # ------------------------------------------------------------------ edge
  iam-proxy:
    <<: [*hardening, *logging]
    image: nginxinc/nginx-unprivileged:1.27.3-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:${IAM_HTTP_PORT:-8088}:8080"   # dev: localhost only; TLS is terminated here in compose.prod.yaml
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,uid=101,gid=101
    depends_on:
      iam-web: { condition: service_started }
      iam-core: { condition: service_started }
    networks: [edge]
    mem_limit: 256m

  iam-web:
    <<: [*hardening, *logging]
    build: { context: ../../web }
    image: iam-web:dev
    user: "101:101"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
    networks: [edge]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ core
  iam-core:
    <<: [*hardening, *logging]
    build: { context: ../.., dockerfile: core/Dockerfile }
    image: iam-core:dev
    user: "10001:10001"
    environment:
      IAM_DB_URL: jdbc:postgresql://postgres:5432/iam
      IAM_DB_USER: iam_app
      IAM_DB_MIGRATION_USER: iam_owner
      # Secret values are read from /run/secrets via Spring's configtree (file name = property name).
      SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
    secrets:
      - source: iam_app_password
        target: spring.datasource.password
      - source: iam_owner_password
        target: spring.flyway.password
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, core]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  # ------------------------------------------------------------------ core dependencies
  postgres:
    <<: [*hardening, *logging]
    image: postgres:16.4-alpine
    user: "70:70"                       # runs directly as the postgres user; no root entrypoint, no capabilities
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: iam_superuser
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets: [pg_superuser_password, iam_owner_password, iam_app_password, iam_readonly_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,uid=70,gid=70
    networks: [core]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_superuser -d iam"]
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak-db:
    <<: [*hardening, *logging]
    image: postgres:16.4-alpine
    user: "70:70"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes:
      - kc-db-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/postgresql:size=8m,uid=70,gid=70
    networks: [core]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak:
    <<: *logging
    image: quay.io/keycloak/keycloak:26.0.5
    # Exception to read_only (documented): Keycloak's start-dev writes build artifacts under /opt/keycloak.
    # Still non-root, no capabilities, no-new-privileges. Production uses an optimized pre-built image (Phase 9).
    user: "1000:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)" &&
        exec /opt/keycloak/bin/kc.sh start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: http://localhost:${IAM_HTTP_PORT:-8088}/auth
      KC_HEALTH_ENABLED: "true"
    secrets: [keycloak_db_password, keycloak_admin_password]
    depends_on:
      keycloak-db: { condition: service_healthy }
    networks: [edge, core]
    mem_limit: 1g

  vault:
    <<: [*hardening, *logging]
    image: hashicorp/vault:1.17.6
    user: "100:1000"                    # vault user; bypasses the root entrypoint (no setuid needed)
    entrypoint: ["vault", "server", "-config=/vault/config/vault-dev.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault-dev.hcl:/vault/config/vault-dev.hcl:ro
      - vault-data:/vault/file
    networks: [core]
    mem_limit: 512m
    healthcheck:
      # 200 = unsealed/active, 429 standby, 501 not initialized, 503 sealed → only "reachable" is checked here.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  rabbitmq:
    <<: *logging
    image: rabbitmq:4.0.5-management-alpine
    # Exception to read_only (documented): the image entrypoint writes generated config under /etc/rabbitmq.
    user: "100:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)" &&
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: iam
      RABBITMQ_DEFAULT_VHOST: iam
    secrets: [rabbitmq_password]
    volumes:
      - mq-data:/var/lib/rabbitmq
    networks: [core]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5

  cache:
    <<: [*hardening, *logging]
    image: redis:7.4.1-alpine           # Redis-compatible cache; Valkey is a drop-in alternative (ARCHITECTURE §8)
    user: "999:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec redis-server --save '' --appendonly no --protected-mode yes
        --requirepass "$$(cat /run/secrets/cache_password)" --maxmemory 256mb --maxmemory-policy allkeys-lru
    secrets: [cache_password]
    networks: [core]
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/cache_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  edge: {}
  core:
    # Core data services are not reachable from outside the stack. Set internal: true in production;
    # kept routable in dev so images can resolve package mirrors during local troubleshooting.
    internal: false

volumes:
  pg-data: {}
  kc-db-data: {}
  vault-data: {}
  mq-data: {}

secrets:
  pg_superuser_password:   { file: ./secrets/pg_superuser_password }
  iam_owner_password:      { file: ./secrets/iam_owner_password }
  iam_app_password:        { file: ./secrets/iam_app_password }
  iam_readonly_password:   { file: ./secrets/iam_readonly_password }
  keycloak_db_password:    { file: ./secrets/keycloak_db_password }
  keycloak_admin_password: { file: ./secrets/keycloak_admin_password }
  rabbitmq_password:       { file: ./secrets/rabbitmq_password }
  cache_password:          { file: ./secrets/cache_password }
