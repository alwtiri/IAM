openapi: 3.1.0
info:
  title: Enterprise IAM / PAM Platform — Core API
  version: 1.0.0-phase3
  summary: Public REST API of iam-core (contract-first, ADR-0012).
  description: 'Phase 1 foundation contract. It fixes the cross-cutting elements every endpoint uses

    (error model, pagination, operations, capability states, health, headers).

    Business endpoints are added additively in their phases; each operation carries

    `x-iam-phase` (phase that implements it) and `x-iam-permission` (server-side permission).

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://iam.example.internal
  description: Placeholder; real hostnames are environment configuration.
security:
- bffSession: []
- bearer: []
tags:
- name: system
  description: Platform information and health.
- name: operations
  description: Long-running operations (spec §46).
- name: capabilities
  description: Capability model (spec §18).
- name: me
  description: Current identity
- name: organization
  description: Organization model (spec §5)
- name: persons
  description: Persons (spec §6)
- name: identities
  description: Identities and lifecycle (spec §6–§7)
- name: authorization
  description: Roles, permissions, scoped assignments (spec §19)
- name: audit
  description: Audit and chain verification (spec §49–§50)
- name: targets
  description: Targets (spec §10)
- name: providers
  description: Provider instances (spec §11)
- name: accounts
  description: Account Management Core (spec §12–§14, G8)
- name: requests
  description: Access requests, approvals, policies and SoD (spec §20–§24)
- name: vault
  description: Privileged credential vault, rotation and checkout (Phase 6, ADR-0021)
paths:
  /api/v1/system/info:
    get:
      tags:
      - system
      operationId: getSystemInfo
      summary: Platform version and enabled extensions.
      x-iam-phase: 2
      x-iam-permission: system:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Platform information.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/system/health:
    get:
      tags:
      - system
      operationId: getSystemHealth
      summary: Health of every component with the functionality each affects (spec §62).
      x-iam-phase: 2
      x-iam-permission: system:health:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Aggregated health. Returned even when components are degraded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/operations:
    get:
      tags:
      - operations
      operationId: listOperations
      summary: List operations visible to the caller (scope-filtered).
      x-iam-phase: 2
      x-iam-permission: operation:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OperationStatus'
      responses:
        '200':
          description: A page of operations.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/operations/{operationId}:
    get:
      tags:
      - operations
      operationId: getOperation
      summary: Get one operation. Returns 404 if outside the caller's scope.
      x-iam-phase: 2
      x-iam-permission: operation:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The operation.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/capabilities/catalog:
    get:
      tags:
      - capabilities
      operationId: getCapabilityCatalog
      summary: All capability identifiers and status values known to this platform version.
      x-iam-phase: 2
      x-iam-permission: system:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Capability catalog.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityCatalog'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      tags:
      - me
      operationId: getMe
      summary: Effective access of the caller
      x-iam-phase: 2
      x-iam-permission: (authenticated)
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAccess'
  /api/v1/org-units:
    get:
      tags:
      - organization
      operationId: listOrgUnits
      summary: List org units (scope-filtered)
      x-iam-phase: 2
      x-iam-permission: org:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: parentId
        in: query
        required: false
        schema: &id003
          type: string
          format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitPage'
    post:
      tags:
      - organization
      operationId: createOrgUnit
      summary: Create an org unit (root units require GLOBAL scope)
      x-iam-phase: 2
      x-iam-permission: org:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgUnit'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
  /api/v1/org-units/{id}:
    get:
      tags:
      - organization
      operationId: getOrgUnit
      summary: Get an org unit
      x-iam-phase: 2
      x-iam-permission: org:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - &id001
        $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
    patch:
      tags:
      - organization
      operationId: renameOrgUnit
      summary: Rename an org unit
      x-iam-phase: 2
      x-iam-permission: org:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      - &id002
        $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameOrgUnit'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
  /api/v1/positions:
    get:
      tags:
      - organization
      operationId: listPositions
      summary: List positions
      x-iam-phase: 2
      x-iam-permission: org:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogEntry'
    post:
      tags:
      - organization
      operationId: createPosition
      summary: Create a position (GLOBAL scope)
      x-iam-phase: 2
      x-iam-permission: org:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogEntry'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
  /api/v1/locations:
    get:
      tags:
      - organization
      operationId: listLocations
      summary: List locations
      x-iam-phase: 2
      x-iam-permission: org:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogEntry'
    post:
      tags:
      - organization
      operationId: createLocation
      summary: Create a location (GLOBAL scope)
      x-iam-phase: 2
      x-iam-permission: org:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogEntry'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
  /api/v1/persons:
    get:
      tags:
      - persons
      operationId: listPersons
      summary: List persons (scope-filtered)
      x-iam-phase: 2
      x-iam-permission: person:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
    post:
      tags:
      - persons
      operationId: createPerson
      summary: Create a person
      x-iam-phase: 2
      x-iam-permission: person:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
  /api/v1/persons/{id}:
    get:
      tags:
      - persons
      operationId: getPerson
      summary: Get a person
      x-iam-phase: 2
      x-iam-permission: person:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
    patch:
      tags:
      - persons
      operationId: updatePerson
      summary: Update a person (changing org unit is audited as person.moved)
      x-iam-phase: 2
      x-iam-permission: person:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
  /api/v1/identities:
    get:
      tags:
      - identities
      operationId: listIdentities
      summary: List identities (scope-filtered)
      x-iam-phase: 2
      x-iam-permission: identity:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: personId
        in: query
        required: false
        schema: *id003
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IdentityState'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPage'
    post:
      tags:
      - identities
      operationId: createIdentity
      summary: Create an identity (state PENDING)
      x-iam-phase: 2
      x-iam-permission: identity:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentity'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/v1/identities/{id}:
    get:
      tags:
      - identities
      operationId: getIdentity
      summary: Get an identity
      x-iam-phase: 2
      x-iam-permission: identity:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/v1/identities/{id}:activate:
    post:
      tags:
      - identities
      operationId: activateIdentity
      summary: Activate an identity
      x-iam-phase: 2
      x-iam-permission: identity:lifecycle
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/v1/identities/{id}:suspend:
    post:
      tags:
      - identities
      operationId: suspendIdentity
      summary: Suspend an identity
      x-iam-phase: 2
      x-iam-permission: identity:lifecycle
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequiredReason'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/v1/identities/{id}:reinstate:
    post:
      tags:
      - identities
      operationId: reinstateIdentity
      summary: Reinstate an identity
      x-iam-phase: 2
      x-iam-permission: identity:lifecycle
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/v1/identities/{id}:disable:
    post:
      tags:
      - identities
      operationId: disableIdentity
      summary: Disable an identity
      x-iam-phase: 2
      x-iam-permission: identity:lifecycle
      x-iam-step-up: true
      description: Requires recent multi-factor authentication (STEP_UP_REQUIRED otherwise).
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequiredReason'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/v1/identities/{id}/platform-user:
    put:
      tags:
      - identities
      operationId: linkPlatformUser
      summary: Link the identity to a Keycloak subject
      x-iam-phase: 2
      x-iam-permission: identity:platform-user
      x-iam-step-up: true
      description: Requires recent multi-factor authentication (STEP_UP_REQUIRED otherwise).
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUserLink'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: No content
  /api/v1/identities/{id}:create-login:
    post:
      tags:
      - identities
      operationId: createLogin
      summary: Create the Keycloak login for the identity, link it and send the invitation (set password + enrol MFA)
      x-iam-phase: 3
      x-iam-permission: identity:platform-user
      x-iam-step-up: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Login created
          content:
            application/json:
              schema:
                type: object
                required:
                - subject
                - invitationSent
                properties:
                  subject:
                    type: string
                  invitationSent:
                    type: boolean
  /api/v1/identities/{id}:resend-invitation:
    post:
      tags:
      - identities
      operationId: resendLoginInvitation
      summary: Send the login invitation again
      x-iam-phase: 3
      x-iam-permission: identity:platform-user
      x-iam-step-up: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: No content
  /api/v1/policies:
    get:
      tags:
      - requests
      operationId: listPolicies
      summary: Access policies (deny-overrides, ADR-0013)
      x-iam-phase: 4
