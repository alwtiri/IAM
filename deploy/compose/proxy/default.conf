# iam-proxy (dev). Routes: /api, /oauth2, /login, /logout → iam-core · /auth → keycloak · / → iam-web.
# Internal extension API (/internal/v1) and actuator are never routed from the edge.
# Rate limits (Phase 9): login endpoints and the API per client address; bursts absorb normal page loads.
limit_req_zone $binary_remote_addr zone=iam_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=iam_api:10m rate=50r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # $http_host keeps the client-visible host:port (e.g. localhost:8088) so the Core builds correct OAuth redirect URIs.
  # Keycloak only accepts registered redirect URIs, so a forged Host header cannot redirect tokens elsewhere.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  # Resolve upstream names per request (Docker DNS). Without this nginx keeps the IPs from its start, and after
  # `docker compose up --build` recreates iam-core/iam-web their IPs can swap, sending UI traffic to the Core.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $core     http://iam-core:8080;
  set $web      http://iam-web:8080;
  set $keycloak http://keycloak:8080;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /internal/ { return 404; }
  location /actuator/ { return 404; }

  location /api/          { limit_req zone=iam_api burst=100 nodelay; proxy_pass $core; }
  location /oauth2/       { limit_req zone=iam_auth burst=20 nodelay; proxy_pass $core; }
  location /login/oauth2/ { limit_req zone=iam_auth burst=20 nodelay; proxy_pass $core; }
  location = /logout      { proxy_pass $core; }
  location /auth/         { limit_req zone=iam_auth burst=40 nodelay; proxy_pass $keycloak; }
  location /              { proxy_pass $web; }
}
