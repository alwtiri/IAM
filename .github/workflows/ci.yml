# CI foundation (ADR-0011). Pipeline logic lives in Gradle/pnpm/ci scripts so GitLab CI can call the same entry points.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, unit & architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (includes ModularityTest, ModuleBoundaryTest, provider contract kit)
        run: ./gradlew --no-daemon build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  web:
    name: Web typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    name: Contracts & deployment policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1 lint contracts/openapi/iam-core-v1.yaml
      - name: Java ↔ contract enum sync
        run: |
          python3 -m pip install --quiet pyyaml
          python3 ci/check-contract-sync.py
      - name: Compose hardening policy
        run: |
          cd deploy/compose
          ./scripts/generate-dev-secrets.sh >/dev/null
          docker compose config --format json | python3 ../../ci/check-compose-policy.py

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (Gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: SAST (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --error --metrics=off \
            --config p/java --config p/typescript --config p/dockerfile --config p/secrets \
            --config ci/semgrep/iam-rules.yaml
      - name: Filesystem & IaC scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  images:
    name: Build & scan container images
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build iam-core image
        run: docker build -f core/Dockerfile -t iam-core:ci .
      - name: Build iam-web image
        run: docker build -t iam-web:ci web
      - name: Scan iam-core image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-core:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan iam-web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-web:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      # Image push is disabled until a registry is chosen (Q-05). SBOM and signing are added in Phase 9.

