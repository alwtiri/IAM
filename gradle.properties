org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Security overrides of Spring Boot managed versions (read by the dependency-management plugin as BOM properties).
# Remove each line once the Boot BOM ships the same or a newer version.
# Tomcat 11.0.24 -> 11.0.25: CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (CRITICAL)
tomcat.version=11.0.25
# RabbitMQ amqp-client 5.27.1 -> 5.34.0: CVE-2026-63337, CVE-2026-69219, CVE-2026-69220, CVE-2026-75516 (HIGH)
rabbit-amqp-client.version=5.34.0
