            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,64}$
        status:
          type: string
          enum:
          - ACTIVE
          - MAINTENANCE
          - DECOMMISSIONED
        id: *id003
        discoveryState:
          type: string
        reconciliationState:
          type: string
        health:
          type: string
        version:
          type: integer
    TargetPage:
      type: object
      required:
      - items
      - nextCursor
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        nextCursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
    RegisterProviderInstance:
      type: object
      required:
      - type
      - name
      - endpoint
      properties:
        type:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
        name:
          type: string
          maxLength: 100
        endpoint:
          type: string
          maxLength: 500
          examples:
          - ssh://srv01.example.org:22
        settings:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
          description: Non-secret settings only; keys containing password/secret/token/privatekey are rejected.
        credential:
          type:
          - string
          - 'null'
          writeOnly: true
          maxLength: 16384
          description: Stored only in Vault; never returned.
    ProviderInstance:
      type: object
      required:
      - id
      - type
      - name
      - endpoint
      - credentialConfigured
      - enabled
      - health
      - circuitState
      - version
      properties:
        id: *id003
        type:
          type: string
        name:
          type: string
        endpoint:
          type: string
        settings:
          type: object
          additionalProperties:
            type: string
        credentialConfigured:
          type: boolean
        enabled:
          type: boolean
        health:
          $ref: '#/components/schemas/HealthStatus'
        circuitState:
          type: string
          enum:
          - CLOSED
          - OPEN
          - HALF_OPEN
        lastHealthAt: *id014
        failureReason:
          type:
          - string
          - 'null'
        version:
          type: integer
    ProviderInstancePage:
      type: object
      required:
      - items
      - nextCursor
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderInstance'
        nextCursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
    AccountType:
      type: string
