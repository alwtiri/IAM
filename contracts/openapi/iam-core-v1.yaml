components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-iam_session
      description: Browser session issued by the Core BFF after OIDC login. State-changing requests also need X-CSRF-Token.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 access token from Keycloak for automation clients. Roles are never read from the token.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Accepted if it matches ^[A-Za-z0-9._-]{8,64}$, otherwise replaced by a generated value.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{8,64}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on POSTs that create resources or start operations (ADR-0012).
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current resource version (optimistic locking).
      schema:
        type: integer
        minimum: 0
    Id:
      name: id
      in: path
      required: true
      schema: *id003
  headers:
    CorrelationId:
      description: Correlation id used for this request.
      schema:
        type: string
  responses:
    Error:
      description: Structured error (spec §73). Never contains stack traces or secret material.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ErrorCode:
      type: string
      description: Must equal com.enterprise.iam.kernel.ErrorCode (checked in CI).
      enum:
      - VALIDATION_FAILED
      - AUTHENTICATION_REQUIRED
      - ACCESS_DENIED
      - STEP_UP_REQUIRED
      - POLICY_DENIED
      - SOD_CONFLICT
      - NOT_FOUND
      - CONCURRENT_MODIFICATION
      - INVALID_STATE_TRANSITION
      - ALREADY_EXISTS
      - IDEMPOTENCY_KEY_REUSED
      - UNSUPPORTED_CAPABILITY
      - RATE_LIMITED
      - PROVIDER_UNAVAILABLE
      - SECRETS_UNAVAILABLE
      - AUTHENTICATION_UNAVAILABLE
      - DEPENDENCY_UNAVAILABLE
      - OPERATION_TIMEOUT
      - INTERNAL_ERROR
    ApiError:
      type: object
      required:
      - code
      - message
      - retryable
      - timestamp
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 1000
        operationId:
          type:
          - string
          - 'null'
          format: uuid
        providerId:
          type:
          - string
          - 'null'
          format: uuid
        retryable:
          type: boolean
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
    FieldIssue:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    PageInfo:
      type: object
      required:
      - limit
      properties:
        limit:
          type: integer
        nextCursor:
          type:
          - string
          - 'null'
    OperationStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCESS
      - FAILED
      - TIMEOUT
      - CANCELLED
      - PARTIAL
      - UNKNOWN
      description: SUCCESS is only reported after verification of the target state (spec §46).
    Operation:
      type: object
      required:
      - id
      - type
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          examples:
          - ACCOUNT_DISABLE
        providerInstanceId:
          type:
          - string
          - 'null'
          format: uuid
        targetId:
          type:
          - string
          - 'null'
          format: uuid
        requesterId:
          type:
          - string
          - 'null'
          format: uuid
        requestId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/OperationStatus'
        statusReason:
          type:
          - string
          - 'null'
          description: e.g. back-pressure, circuit open, waiting for secrets.
        progress:
          type: integer
          minimum: 0
          maximum: 100
        attempt:
          type: integer
        maxAttempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        deadline:
          type:
          - string
          - 'null'
          format: date-time
