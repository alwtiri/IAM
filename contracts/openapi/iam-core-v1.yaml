      required:
      - id
      - targetId
      - providerInstanceId
      - nativeId
      - name
      - type
      - privileged
      - governanceState
      - nativeStatus
      - source
      - openFindings
      - version
      properties:
        id: *id016
        targetId: *id016
        targetName:
          type: string
        providerInstanceId: *id016
        providerType:
          type: string
        nativeId:
          type: string
        name:
          type: string
        displayName:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/AccountType'
        privileged:
          type: boolean
        privilegeReason:
          type:
          - string
          - 'null'
        ownerIdentityId: &id017
          type:
          - string
          - 'null'
          format: uuid
        linkedIdentityId: *id017
        governanceState:
          $ref: '#/components/schemas/AccountGovernanceState'
        nativeStatus:
          $ref: '#/components/schemas/AccountNativeStatus'
        source:
          type: string
          enum:
          - DISCOVERY
          - PLATFORM
          - IMPORT
        attributes:
          type: object
          additionalProperties:
            type: string
        lastSeenAt: &id018
          type:
          - string
          - 'null'
          format: date-time
        lastLoginAt: *id018
        passwordLastSetAt: *id018
        openFindings:
