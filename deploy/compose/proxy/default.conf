# iam-proxy (dev). Routes: /api, /oauth2, /login, /logout → iam-core · /auth → keycloak · / → iam-web.
# Internal extension API (/internal/v1) and actuator are never routed from the edge.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # $http_host keeps the client-visible host:port (e.g. localhost:8088) so the Core builds correct OAuth redirect URIs.
  # Keycloak only accepts registered redirect URIs, so a forged Host header cannot redirect tokens elsewhere.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /internal/ { return 404; }
  location /actuator/ { return 404; }

  location /api/          { proxy_pass http://iam-core:8080; }
  location /oauth2/       { proxy_pass http://iam-core:8080; }
  location /login/oauth2/ { proxy_pass http://iam-core:8080; }
  location = /logout      { proxy_pass http://iam-core:8080; }
  location /auth/         { proxy_pass http://keycloak:8080; }
  location /              { proxy_pass http://iam-web:8080; }
}
